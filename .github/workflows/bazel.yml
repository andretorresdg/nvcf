           return r.stdout+'\n'+r.stderr
          cpu=pathlib.Path('/proc/cpuinfo').read_text()
          features=set(next((x.split(':',1)[1] for x in cpu.splitlines() if x.startswith('flags')), '').split())
          summary={'lane':os.environ['PROBE_LANE'],'source_commit':os.environ['GITHUB_SHA'],
