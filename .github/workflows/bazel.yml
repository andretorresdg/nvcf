# Diagnostic branch only. This workflow is not intended for merge.
name: Java runtime verification
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: java-runtime-verification-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  containers:
    name: JVM container (${{ matrix.runner }})
    timeout-minutes: 10
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, linux-amd64-cpu16]
    container:
      image: ${{ vars.BAZEL_CI_IMAGE || 'ghcr.io/dsx-ai-factory/nvcf/bazel-ci:0.14.0' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PROBE_LANE: container-${{ matrix.runner }}
      PROBE_IMAGE: ${{ vars.BAZEL_CI_IMAGE || 'ghcr.io/dsx-ai-factory/nvcf/bazel-ci:0.14.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect actual JVMs
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,subprocess,time
          root=pathlib.Path.cwd()
          evidence=root/'runtime-evidence'
          evidence.mkdir(exist_ok=True)
          flag_names=('UseBASE64Intrinsics','UseAVX')
          def flags(text):
           return {k:m.group(1) for k in flag_names if (m:=re.search(r'\b'+k+r'\s*:?=\s*(true|false|[0-9]+)\b',text))}
          def release(executable):
           p=pathlib.Path(executable).resolve().parent.parent/'release'
           values={}
           for line in p.read_text().splitlines():
            k,sep,v=line.partition('=')
            if sep and k in ('JAVA_VERSION','JAVA_RUNTIME_VERSION','IMPLEMENTOR','IMPLEMENTOR_VERSION','OS_ARCH'):
             values[k]=v.strip('"')
           return values
          def run(argv,env=None):
           r=subprocess.run(argv,cwd=root,text=True,capture_output=True,timeout=180,env=env)
           if r.returncode:
            # Do not emit raw logs, arguments or environment variables.
            raise RuntimeError(pathlib.Path(argv[0]).name+' failed with status '+str(r.returncode))
           return r.stdout+'\n'+r.stderr
          cpu=pathlib.Path('/proc/cpuinfo').read_text()
          features=set(next((x.split(':',1)[1] for x in cpu.splitlines() if x.startswith('flags')), '').split())
          summary={'lane':os.environ['PROBE_LANE'],'source_commit':os.environ['GITHUB_SHA'],
           'image':os.environ.get('PROBE_IMAGE'),
           'workspace_bazelrc_sha256':hashlib.sha256((root/'.bazelrc').read_bytes()).hexdigest(),
           'cpu_features':{x:x in features for x in ['avx2','avx512f','avx512bw','avx512vl','avx512vbmi']},
           'java_option_environment':{k:{'present':k in os.environ,'has_disable_option':'-XX:-UseBASE64Intrinsics' in os.environ.get(k,'').split()} for k in ['JAVA_TOOL_OPTIONS','_JAVA_OPTIONS','JDK_JAVA_OPTIONS']},
           'jvms':[]}
          java=pathlib.Path(os.environ['JAVA_HOME'])/'bin/java'
          system={'role':'system',**release(java),**flags(run([str(java),'-XX:+PrintFlagsFinal','-version']))}
          assert 'UseBASE64Intrinsics' in system, 'Missing system JVM flag'
          summary['jvms'].append(system)
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'jvm-probe-bazel'
          bazel=shutil.which('bazel')
          assert bazel, 'Missing workflow Bazel launcher'
          args=[bazel,'--output_user_root='+str(output)]
          try:
           run(args+['version'])
           pids=[]
           for _ in range(20):
            pids=list(output.rglob('server.pid.txt'))
            if pids: break
            time.sleep(0.2)
           assert len(pids)==1, 'Expected one isolated Bazel server'
           pid=int(pids[0].read_text().strip())
           executable=os.readlink('/proc/'+str(pid)+'/exe')
           env={k:v for k,v in os.environ.items() if k not in ['JAVA_TOOL_OPTIONS','_JAVA_OPTIONS','JDK_JAVA_OPTIONS']}
           jcmd=pathlib.Path(os.environ['JAVA_HOME'])/'bin/jcmd'
           actual=run([str(jcmd),str(pid),'VM.flags','-all'],env=env)
           server={'role':'bazel_server',**release(executable),**flags(actual)}
           assert 'UseBASE64Intrinsics' in server, 'Missing Bazel server JVM flag'
           summary['jvms'].append(server)
          finally:
           subprocess.run(args+['shutdown'],cwd=root,capture_output=True,timeout=30)
          summary['scope']='System JVM and actual isolated Bazel server; build actions, compiler workers, test JVMs and other runner variants were not exercised.'
          (evidence/'results.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          lines=['# Java runtime verification', '', 'Lane: '+summary['lane'], '', '| JVM | Vendor | Runtime | Base64 intrinsics |', '| --- | --- | --- | --- |']
          for row in summary['jvms']:
           lines.append('| '+row['role']+' | '+row.get('IMPLEMENTOR','')+' | '+row.get('JAVA_RUNTIME_VERSION',row['JAVA_VERSION'])+' | '+row['UseBASE64Intrinsics']+' |')
          lines+=['',summary['scope']]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ env.PROBE_LANE }}
          path: runtime-evidence/results.json
          if-no-files-found: warn
          retention-days: 14
  bare:
    name: JVM bare host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROBE_LANE: bare-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install workflow Bazel launcher
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Inspect actual JVMs
